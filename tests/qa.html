<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>QA — Monochrome Systems</title><style>body{background:#eee;color:#111;font:16px monospace}iframe{display:block;border:1px solid #333;margin:20px 0}pre{white-space:pre-wrap}</style><h1>Testes locais isolados</h1><p>Preferências de sistema simuladas em matchMedia; não são emulação nativa do navegador.</p><button id="run">Executar testes</button><pre id="output"></pre><div id="frames"></div><script>
const out=document.querySelector('#output'), results=[];let f;
const wait=t=>new Promise(r=>setTimeout(r,t));
function assert(ok,name,details=''){results.push({name,pass:!!ok,details});out.textContent=JSON.stringify(results,null,2);}
async function load(query,width=1440,base='site'){if(f)f.remove();localStorage.clear();sessionStorage.clear();f=document.createElement('iframe');f.width=width;f.height=900;f.src='/'+base+'/index.html?'+query;document.querySelector('#frames').append(f);await new Promise(r=>f.onload=r);await wait(2400);return f.contentWindow;}
async function run(){results.length=0;document.querySelector('#run').disabled=true;try{
 let w;
 for(const width of [375,768,1440]){w=await load('system=dark',width);let d=w.document;assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'sem overflow '+width,`${d.documentElement.scrollWidth}/${d.documentElement.clientWidth}`);assert(d.querySelector('#projects').children.length===2,'projetos preservados '+width);assert(w.qaErrors.length===0,'sem erros de runtime '+width,w.qaErrors.join(';'));}
 w=await load('system=light',1440);let d=w.document;assert(d.documentElement.dataset.theme==='light','preferência inicial clara (simulação)');d.querySelector('#theme').click();await wait(750);assert(d.documentElement.dataset.theme==='dark'&&d.querySelector('#theme').getAttribute('aria-pressed')==='true','tema manual e aria-pressed');assert(localStorage.getItem('arthur-lacerda-theme')==='dark','tema persistido');
 d.querySelector('#motion').click();await wait(100);assert(d.documentElement.classList.contains('motion-paused'),'pausa manual');
 d.documentElement.style.fontSize='200%';await wait(300);assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'texto ampliado 200% desktop',JSON.stringify([...d.querySelectorAll('*')].filter(el=>el.getBoundingClientRect().right>d.documentElement.clientWidth+1).map(el=>el.tagName+'.'+el.className)));
 w=await load('reduced=1&system=dark');d=w.document;assert(d.documentElement.classList.contains('motion-paused')&&!d.body.classList.contains('intro'),'reduced motion JS (simulação)');assert(!d.querySelector('.scene-enhanced')||d.querySelector('.system-scene').dataset.motion==='static','cena estática reduced motion');
 w=await load('touch=1&system=light',390);d=w.document;assert(!d.documentElement.classList.contains('cursor-active'),'touch sem cursor customizado (simulação)');
 w=await load('fallback=1');assert(!w.document.querySelector('.scene-enhanced'),'fallback sem WebGL');
 w=await load('nojs=1',375);d=w.document;assert(d.querySelectorAll('.project').length===2&&!d.documentElement.classList.contains('js'),'conteúdo estático sem JavaScript');assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth,'no-JS mobile sem overflow');
 w=await load('fixture=1&system=dark');d=w.document;assert(d.querySelectorAll('.certificate').length===7,'viewer: sete fixtures isoladas');assert(d.querySelector('.certificate h3').textContent.endsWith('6'),'certificados ordenados por data');const trigger=d.querySelector('[data-certificate]');trigger.focus();trigger.click();assert(d.querySelector('#certificate-dialog').open,'viewer abre');assert(d.querySelector('#certificate-dialog').contains(d.activeElement),'foco entra no viewer');d.querySelector('#certificate-dialog .dialog-close').click();await wait(20);assert(d.activeElement===trigger,'foco retorna ao acionador');d.querySelector('[data-filter="development"]').click();assert(d.querySelectorAll('.certificate:not([hidden])').length===3,'filtro de categoria');assert(d.querySelectorAll('#certificate-dialog a[rel="noopener noreferrer"]').length===1,'link de verificação seguro');
 w=await load('system=dark',1440);d=w.document;assert(!d.querySelector('#lab'),'arquivo removido');assert(d.querySelectorAll('.social-row').length===3,'três redes reais');assert(w.qaErrors.length===0,'console final limpo',w.qaErrors.join(';'));assert(true,'final timing / mesmo navegador',JSON.stringify({navigation:w.performance.getEntriesByType('navigation').map(x=>({load:x.loadEventEnd,dom:x.domContentLoadedEventEnd})),metrics:w.qaMetrics,bytes:w.performance.getEntriesByType('resource').reduce((n,e)=>n+e.transferSize,0)}));
 }catch(e){assert(false,'execução',e.stack)}finally{await fetch('/results',{method:'POST',body:JSON.stringify(results,null,2)});document.querySelector('#run').disabled=false;document.title='QA concluído: '+results.filter(x=>x.pass).length+'/'+results.length;}}
document.querySelector('#run').onclick=run;
</script></html>
